<div class="card" (click)="cardClick.emit(ad)">
  @if (ad.imageUrl) {
    <img class="card__image" [src]="ad.imageUrl" [alt]="ad.title">
  } @else {
    <div class="card__image card__image--placeholder">
      Нет изображения
    </div>
  }
  
  <div class="card__container card__container--info">
    <h3 class="card__title">{{ ad.title }}</h3>
    <p class="card__price">{{ ad.price | currency:'RUB':'symbol-narrow':'1.0-0' }}</p>
    <p class="card__address">{{ ad.location }}</p>
    <p class="card__datetime">{{ ad.date }}</p>
  </div>
</div>
