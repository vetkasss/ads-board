@if (visible) {
  <div class="dialog-overlay" (click)="hide()">
    <div class="dialog" (click)="$event.stopPropagation()" role="dialog" 
         aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title" class="dialog-title">Пользователь</h2>
        <button class="close-btn" (click)="hide()" aria-label="Закрыть диалог">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      
      <div class="dialog-content">
        <div class="phone-info">
          <p class="phone-number">{{ phoneNumber }}</p>
        </div>
        
        <div class="divider" aria-hidden="true"></div>
        
        <div class="safety-rules">
          <span class="rules-title">Правила безопасных сделок</span>
          <ul class="rules-list">
            <li>Храните в тайне почту, данные паспорта и банковской карты</li>
            <li>Игнорируйте ссылки на оплату, которые присылает собеседник</li>
            <li>Никому не говорите коды из смс и пуш-уведомлений</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
}
